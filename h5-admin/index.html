<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>盛杰运营平台 · 统一后台（演示）</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="盛杰运营平台统一后台演示：活动、渠道、参展商、订单分账与社群 AI">
<meta name="theme-color" content="#17130F">
<link rel="icon" type="image/png" sizes="512x512" href="assets/icon-512.png">
<link rel="stylesheet" href="styles/app.css">
</head>
<body>

<div class="shell">

  <aside class="side" id="side">
    <div class="side__brand">
      <span class="side__mark">盛</span>
      <div class="side__name">
        <b>盛杰运营平台</b>
        <span>统一后台 · 演示</span>
      </div>
    </div>
    <nav class="side__nav" id="nav" aria-label="后台导航"></nav>
    <div class="side__foot">
      <button type="button" class="side__reset" data-act="reset">重置演示</button>
      <span class="side__ver">V0.1 · 数据为演示排布</span>
    </div>
  </aside>

  <div class="main">
    <header class="top">
      <div class="top__crumb">
        <button type="button" class="top__org" data-act="org">盛杰运营方<i></i></button>
        <span class="top__sep">/</span>
        <span class="top__event">第34届北京国际美博会</span>
      </div>
      <div class="top__right">
        <span class="top__count" id="top-count"></span>
        <span class="top__slot" id="top-slot"></span>
        <span class="top__me" title="盛">盛</span>
      </div>
    </header>

    <main class="view" id="view" tabindex="-1"></main>
  </div>

</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>
<div class="tip" id="tip" role="presentation" hidden></div>

<div class="modal" id="modal" hidden>
  <div class="modal__mask" data-act="modal-close"></div>
  <div class="modal__panel" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <div class="modal__head"><span id="modal-title">标题</span>
      <button type="button" class="modal__x" data-act="modal-close" aria-label="关闭">×</button></div>
    <div class="modal__body" id="modal-body"></div>
  </div>
</div>

<script src="js/data.js"></script>
<script src="js/app.js"></script>
</body>
</html>
